<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Favicon-Vorschläge</title>
<style>
  body { font-family: system-ui, sans-serif; background: #faf9f7; color: #1c1917; margin: 24px; }
  h2 { font-weight: 500; font-size: 15px; margin: 28px 0 10px; }
  .row { display: flex; gap: 28px; align-items: flex-end; background: #fff; border: 1px solid #e7e5e4; border-radius: 12px; padding: 20px; }
  .cell { text-align: center; font-size: 11px; color: #57534e; }
  .tabbar { display: flex; gap: 4px; padding: 8px 10px 0; border-radius: 10px 10px 0 0; width: fit-content; }
  .tabbar.light { background: #dee1e6; }
  .tabbar.dark { background: #202124; }
  .tab { display: flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: 9px 9px 0 0; font-size: 12px; width: 190px; }
  .tabbar.light .tab { background: #f1f3f4; color: #202124; }
  .tabbar.dark .tab { background: #35363a; color: #e8eaed; }
  .tab img { width: 16px; height: 16px; }
  .grid { display: flex; gap: 40px; }
</style></head><body>
<h1 style="font-size:18px;font-weight:500">Favicon-Vorschläge — Job-Finder</h1>
<div class="grid">
<div>
<h2>1 · Das Blatt</h2><div class="row">
  <div class="cell"><img src="blatt.svg" width="16"><br>16px</div>
  <div class="cell"><img src="blatt.svg" width="32"><br>32px</div>
  <div class="cell"><img src="blatt.svg" width="64"><br>64px</div>
</div></div>
<div>
<h2>2 · Der Haken</h2><div class="row">
  <div class="cell"><img src="haken.svg" width="16"><br>16px</div>
  <div class="cell"><img src="haken.svg" width="32"><br>32px</div>
  <div class="cell"><img src="haken.svg" width="64"><br>64px</div>
</div></div>
<div>
<h2>3 · Das Lesezeichen</h2><div class="row">
  <div class="cell"><img src="lesezeichen.svg" width="16"><br>16px</div>
  <div class="cell"><img src="lesezeichen.svg" width="32"><br>32px</div>
  <div class="cell"><img src="lesezeichen.svg" width="64"><br>64px</div>
</div></div>
</div>

<h2>In der Tab-Leiste (hell · dunkel)</h2>
<div class="grid">
<div class="tabbar light">
  <div class="tab"><img src="blatt.svg">Job-Finder</div>
  <div class="tab"><img src="haken.svg">Job-Finder</div>
  <div class="tab"><img src="lesezeichen.svg">Job-Finder</div>
</div>
<div class="tabbar dark">
  <div class="tab"><img src="blatt.svg">Job-Finder</div>
  <div class="tab"><img src="haken.svg">Job-Finder</div>
  <div class="tab"><img src="lesezeichen.svg">Job-Finder</div>
</div>
</div>
</body></html>
